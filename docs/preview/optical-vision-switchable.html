<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光电视觉 · 可切换主屏</title><style>*{box-sizing:border-box}body{margin:0;background:#031417;color:#e8ffff;font:14px Arial,'Microsoft YaHei'}.app{padding:18px 26px}.head{display:flex;align-items:center;gap:14px}.head .grow{flex:1}.ey{color:#63e9da;letter-spacing:2px}.title{font-size:29px;font-weight:bold}.btn,.tab{border:1px solid #205c65;background:#09262c;color:#e8ffff;border-radius:7px;padding:9px 14px;cursor:pointer}.tab.active{background:#0c5b61;color:#63e9da}.workspace{margin-top:16px;border:1px solid #15515b;border-radius:11px;background:#061d22;padding:12px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.tabs{display:flex;gap:8px}.mode{display:none}.mode.active{display:grid}.relay{grid-template-columns:1fr 300px;gap:12px}.screen{height:650px;border:1px solid #1b5e67;border-radius:8px;background:linear-gradient(135deg,#0a3036,#06191d);display:grid;place-items:center;position:relative;color:#a8ced0}.screen:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.8%,#63e9da22 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,#63e9da22 50%,transparent 50.2%);background-size:75px 75px}.sources{display:grid;grid-template-columns:1fr 1fr;gap:8px}.source{border:1px solid #15515b;border-radius:7px;padding:13px;background:#08262b}.source small{display:block;color:#71a2a5;margin-top:6px}.gimbal{grid-template-columns:1fr 360px;gap:12px}.gscreen{height:650px;background:radial-gradient(circle,#555,#171a20 65%,#0b0e12);position:relative}.osd{position:absolute;top:16px;left:16px;color:#31f24c;font:17px Consolas;line-height:1.45}.cross{position:absolute;left:50%;top:50%;width:80px;height:80px;border:1px solid #b9c6d6;border-radius:50%;transform:translate(-50%,-50%)}.panel{background:#1b1e2c;border:1px solid #3b4054;border-radius:10px;padding:13px}.range{width:100%;accent-color:#4c7dff}.pad{
