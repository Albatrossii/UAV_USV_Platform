<!doctype html><meta charset="utf-8"><title>光电视觉交互预览</title><style>body{margin:0;background:#031316;color:#e7ffff;font:14px Arial;padding:24px}.app{max-width:1500px;margin:auto}.ey{color:#63e9da;letter-spacing:2px}.title{font-size:30px;font-weight:bold;margin:5px 0 18px}.bar,.card{border:1px solid #15505a;background:#071f24;border-radius:10px}.bar{padding:12px;display:flex;gap:8px}.tab,.btn,.dev{padding:9px 13px;border:1px solid #205b64;background:#0a2930;color:#e7ffff;border-radius:6px;cursor:pointer}.tab.active,.dev.active{border-color:#63e9da;color:#63e9da;background:#0b3a40}.layout{display:grid;grid-template-columns:1fr 330px;gap:12px;margin-top:12px}.video{height:560px;position:relative;display:grid;place-items:center;background:linear-gradient(135deg,#0c343a,#06171b)}.hint{text-align:center}.hint b{display:block;font-size:20px;margin-bottom:8px}.hint small{color:#83abad}.meta{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;color:#9bc5c7;font-size:12px}.side{display:flex;flex-direction:column;gap:12px}.card{padding:12px}.card h3{margin:0 0 10px;color:#63e9da}.devices,.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dev{font-size:12px}.dev small{display:block;color:#78a4a7;margin-top:5px}.pad{height:150px;width:150px;border:1px solid #2a7d84;border-radius:50%;margin:12px auto;display:grid;place-items:center;background:#0c3037}.status{color:#72eee0;margin-top:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style><div class="app"><div><div class="ey">ELECTRO-OPTICAL VISION</div><div class="title">光电视觉</div></div><div class="bar"><button class="tab" onclick="mode(this,'relay')">协同回传</button><button class="tab active" onclick="mode(this,'gimbal')">云台相机</button><button class="tab" onclick="document.documentElement.requestFullscreen()">全屏</button></div><div class="layout"><section class="card"><div class="video"><div class="hint"><b id="videoTitle">云台相机实时画面</b><small id="videoSub">RTSP → WebRTC · UAV-01 / A30TR</small></div><div class="meta"><span>Yaw +12.4°　Pitch -18.6°</span><span>24 FPS　86 ms</span></div></div><div class="status" id="status">当前模式：云台相机控制</div></section><aside class="side"><div class="card"><h3>七路信号源</h3><div class="devices"><div class="dev active" onclick="device(this,'UAV-01')">● 空中视角 01<small>UAV-01 · 在线</small></div><div class="dev" onclick="device(this,'UAV-02')">○ 空中视角 02<small>UAV-02 · 等待</small></div><div class="dev" onclick="device(this,'UAV-03')">○ 空中视角 03<small>UAV-03 · 等待</small></div><div class="dev" onclick="device(this,'USV-01')">○ 水面视角 01<small>USV-01 · 等待</small></div></div></div><div class="card"><h3>云台控制</h3><div class="pad">↕　↔　<b>回中</b></div><div class="grid"><button class="btn" onclick="action('一键朝下')">一键朝下</button><button class="btn" onclick="action('FPV模式')">FPV模式</button><button class="btn" onclick="action('EO放大')">EO ＋</button><button class="btn" onclick="action('拍照')">▣ 拍照</button></div></div></aside></div></div><script>function mode(e,m){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.getElementById('videoTitle').textContent=m==='relay'?'协同视频回传':'云台相机实时画面';document.getElementById('status').textContent='当前模式：'+(m==='relay'?'协同视频回传':'云台相机控制')}function device(e,n){document.querySelectorAll('.dev').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.getElementById('videoSub').textContent=n+' / A30TR · RTSP → WebRTC';document.getElementById('status').textContent='当前选中设备：'+n}function action(x){document.getElementById('status').textContent='已触发：'+x+'（模拟指令）'}</script>
