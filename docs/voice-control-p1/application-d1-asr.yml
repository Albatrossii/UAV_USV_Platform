# Load AFTER application-p0-integration.yml. No credentials in repository.
app:
  voiceintelligence:
    enabled: ${D1_ASR_ENABLED:false}
    base-url: http://127.0.0.1:18082
    token: ${D1_ASR_TOKEN:}
    model-revision: ${D1_ASR_MODEL_REVISION:536b0662742c02347bc0e980a01041f333bce120+uav-usv-domain-prompt-v1-beam-2}
    model-alias: whisper-small-cpu-int8-r1
    # E1 only: base64-encoded 32-byte AES key. Keep outside source control and ordinary logs.
    result-encryption-key: ${D1_ASR_RESULT_ENCRYPTION_KEY:}
    # D3 defaults to rules. Set local-llm only after the pinned llama.cpp service is ready.
    intent-provider: ${D3_INTENT_PROVIDER:rules}
    llm-base-url: ${D3_LLM_BASE_URL:http://127.0.0.1:18083}
    llm-token: ${D3_LLM_TOKEN:}
    llm-model: ${D3_LLM_MODEL:qwen2.5-1.5b-instruct-q4_k_m}
    llm-timeout-ms: ${D3_LLM_TIMEOUT_MS:20000}
