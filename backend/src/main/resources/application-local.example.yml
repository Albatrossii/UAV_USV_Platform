spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/uav_usv_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 0
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 30000

app:
  voiceintelligence:
    enabled: ${APP_VOICEINTELLIGENCE_ENABLED:false}
    intent-provider: ${APP_VOICEINTELLIGENCE_INTENT_PROVIDER:rules}
    base-url: ${APP_VOICEINTELLIGENCE_BASE_URL:http://127.0.0.1:18082}
    token: ${APP_VOICEINTELLIGENCE_TOKEN:}
    model-revision: ${APP_VOICEINTELLIGENCE_MODEL_REVISION:}
    model-alias: ${APP_VOICEINTELLIGENCE_MODEL_ALIAS:whisper-small-cpu-int8-r1}
    llm-base-url: ${APP_VOICEINTELLIGENCE_LLM_BASE_URL:http://127.0.0.1:18083}
    llm-token: ${APP_VOICEINTELLIGENCE_LLM_TOKEN:}
    llm-model: ${APP_VOICEINTELLIGENCE_LLM_MODEL:qwen2.5-1.5b-instruct-q4_k_m}
    llm-timeout-ms: ${APP_VOICEINTELLIGENCE_LLM_TIMEOUT_MS:20000}
  ros:
    transport: ${ROS_TRANSPORT:v1}
    state-authority: ${ROS_STATE_AUTHORITY:v1}
  gateway:
    v1:
      websocket-url: ${ROS_GATEWAY_V1_WEBSOCKET_URL:ws://10.16.79.66:8765/uav_usv/v1}
  visual-sensor:
    websocket-enabled: ${VISUAL_SENSOR_WEBSOCKET_ENABLED:true}
    websocket-url: ${VISUAL_SENSOR_WEBSOCKET_URL:ws://10.16.79.66:8765/ws}
  integration:
    token: ${PLATFORM_INTEGRATION_TOKEN:uav-usv-local-agent}
  security:
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}
  control:
    mission-dispatch-mode: ${MISSION_DISPATCH_MODE:ros-gateway-v1}
    vehicle-dispatch-mode: ${VEHICLE_DISPATCH_MODE:browser-unity}
    command-ack-timeout-seconds: ${COMMAND_ACK_TIMEOUT_SECONDS:15}
    wsl-distribution: ${WSL_DISTRIBUTION:Ubuntu22}
    ros-script: ${ROS_RUNTIME_SCRIPT:F:/UAV_USV_Platform/scripts/uav-usv-runtime.sh}
    unity-editor: ${UNITY_EDITOR_PATH:F:/Unity/Editors/2022.3.57f1/Editor/Unity.exe}
    unity-project: ${UNITY_PROJECT_PATH:F:/Unity/Projects/unity_ws}
  runtime:
    ros-enabled: ${ROS_ENABLED:false}
    ros-websocket-url: ${ROS_WEBSOCKET_URL:ws://10.16.79.66:8765/ws}
