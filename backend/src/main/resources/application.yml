server:
  port: 8081
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: uav-usv-platform
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  voicecontrol:
    enabled: ${VOICE_CONTROL_ENABLED:false}
    poll-ms: 100
  ros:
    transport: ${ROS_TRANSPORT:v1}
    state-authority: ${ROS_STATE_AUTHORITY:v1}
  gateway:
    v1:
      enabled: ${ROS_GATEWAY_V1_ENABLED:false}
      websocket-url: ${ROS_GATEWAY_V1_WEBSOCKET_URL:ws://127.0.0.1:8765/uav_usv/v1}
  runtime:
    ros-enabled: ${ROS_ENABLED:false}
    ros-websocket-url: ${ROS_WEBSOCKET_URL:ws://127.0.0.1:8765/uav_usv}
    heartbeat-timeout-seconds: 5
    telemetry-stale-seconds: ${TELEMETRY_STALE_SECONDS:10}
    telemetry-retention-days: 7
    geo-origin:
      enabled: ${GEO_ORIGIN_ENABLED:false}
      latitude: ${GEO_ORIGIN_LATITUDE:0}
      longitude: ${GEO_ORIGIN_LONGITUDE:0}
      east-axis: ${GEO_ORIGIN_EAST_AXIS:X}
      north-axis: ${GEO_ORIGIN_NORTH_AXIS:Z}
  visual-sensor:
    websocket-enabled: ${VISUAL_SENSOR_WEBSOCKET_ENABLED:false}
    websocket-url: ${VISUAL_SENSOR_WEBSOCKET_URL:ws://127.0.0.1:8766/visual_sensors}
  integration:
    token: ${PLATFORM_INTEGRATION_TOKEN}
  control:
    command-dispatch-mode: ${COMMAND_DISPATCH_MODE:browser-unity}
    command-ack-timeout-seconds: ${COMMAND_ACK_TIMEOUT_SECONDS:15}
    command-result-timeout-seconds: ${COMMAND_RESULT_TIMEOUT_SECONDS:75}
    wsl-distribution: ${WSL_DISTRIBUTION:Ubuntu22}
    ros-script: ${ROS_RUNTIME_SCRIPT:F:/UAV_USV_Platform/scripts/uav-usv-runtime.sh}
    unity-editor: ${UNITY_EDITOR_PATH:F:/Unity/Editors/2022.3.57f1/Editor/Unity.exe}
    unity-project: ${UNITY_PROJECT_PATH:F:/Unity/Projects/unity_ws}

