<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | UAV_USV_WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #061113;
      }

      body.embedded #unity-container,
      body.embedded #unity-canvas {
        position: absolute;
        inset: 0;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
      }

      body.embedded #unity-footer {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">UAV_USV_WebGL</div>
      </div>
    </div>
    <script>
      var container = document.querySelector('#unity-container');
      var canvas = document.querySelector('#unity-canvas');
      var loadingBar = document.querySelector('#unity-loading-bar');
      var progressBarFull = document.querySelector('#unity-progress-bar-full');
      var fullscreenButton = document.querySelector('#unity-fullscreen-button');
      var warningBanner = document.querySelector('#unity-warning');
      var urlParameters = new URLSearchParams(window.location.search);
      var embedded = urlParameters.has('embedded');
      var buildStamp = urlParameters.get('v') || String(Date.now());
      var runtimeScope = urlParameters.get('scope') || 'SYSTEM_OVERVIEW';
      var runtimeInstanceId = urlParameters.get('instanceId') || 'overview-unity-01';
      var missionId = urlParameters.get('missionId') || '';
      var runId = urlParameters.get('runId') || '';
      var platformBridgeReady = false;
      var platformCapabilities = {};
      var pendingUnityMessages = [];
      var platformBridgeMethods = [
        'InitializePlatform',
        'LoadScenario',
        'ApplyPoseBatch',
        'SetMissionState',
        'SelectDevice',
        'SetCameraMode',
        'SetTrajectoryVisible',
      ];

      function withBuildStamp(url) {
        return url + (url.indexOf('?') === -1 ? '?' : '&') + 'v=' + encodeURIComponent(buildStamp);
      }

      if (embedded) document.body.classList.add('embedded');

      function postUnityMessage(type, payload) {
        if (!window.parent) return;
        var messagePayload = payload || {};
        window.parent.postMessage(
          {
            source: 'unity-webgl',
            runtimeScope: runtimeScope,
            runtimeInstanceId: runtimeInstanceId,
            message: {
              type: type,
              requestId: messagePayload.requestId ? messagePayload.requestId : '',
              timestamp: Date.now(),
              payload: Object.assign({}, messagePayload, {
                runtimeScope: runtimeScope,
                runtimeInstanceId: runtimeInstanceId,
                missionId: messagePayload.missionId || missionId,
                runId: messagePayload.runId || runId,
              }),
            },
          },
          window.location.origin,
        );
      }

      function eventPayload(parsed) {
        var flat = Object.assign({}, parsed || {});
        delete flat.type;
        delete flat.requestId;
        delete flat.timestamp;
        delete flat.payload;
        var sourcePayload = parsed && parsed.payload ? parsed.payload : {};
        return Object.assign(flat, sourcePayload, {
          runtimeScope: runtimeScope,
          runtimeInstanceId: runtimeInstanceId,
          missionId: sourcePayload.missionId || missionId,
          runId: sourcePayload.runId || runId,
        });
      }

      function publishPlatformReady(payload) {
        var readyPayload = Object.assign(
          {
            ready: true,
            controlsReady: true,
            cameraReady: true,
            algorithmReady: true,
            visualSensorReady: false,
            buildId: 'unity-webgl-platform-bridge',
            capabilities: platformBridgeMethods.slice(),
          },
          payload || {},
        );
        readyPayload.capabilities = Array.from(new Set(
          (platformBridgeMethods || []).concat(
            Array.isArray(readyPayload.capabilities) ? readyPayload.capabilities : [],
            ['camera-control', 'vehicle-control', 'algorithm-scenario', 'visual-sensor'],
          ),
        ));
        readyPayload.ready = readyPayload.ready !== false;
        platformBridgeReady = readyPayload.ready;
        platformCapabilities = {};
        (readyPayload.capabilities || []).forEach(function (capability) {
          platformCapabilities[String(capability)] = true;
        });
        document.documentElement.dataset.platformBridgeReady =
          platformBridgeReady ? 'true' : 'false';
        document.documentElement.dataset.unityBuildId =
          String(readyPayload.buildId || '');
        document.documentElement.dataset.unityCapabilities =
          Object.keys(platformCapabilities).join(',');
        postUnityMessage('platformBridgeReady', readyPayload);
        if (platformBridgeReady) flushPendingUnityMessages();
      }

      window.receiveUnityMessage = function (message) {
        try {
          var parsed = typeof message === 'string' ? JSON.parse(message) : message;
          if (parsed && parsed.type) {
            var normalizedPayload = eventPayload(parsed);
            if (parsed.type === 'platformBridgeReady' || parsed.type === 'platformInitialized') {
              publishPlatformReady(normalizedPayload);
            }
            window.parent.postMessage(
              {
                source: 'unity-webgl',
                runtimeScope: runtimeScope,
                runtimeInstanceId: runtimeInstanceId,
                message: {
                  type: parsed.type,
                  requestId: parsed.requestId || '',
                  timestamp: parsed.timestamp || Date.now(),
                  payload: normalizedPayload,
                },
              },
              window.location.origin,
            );
            if (parsed.type === 'scenarioLoaded') {
              postUnityMessage('scenarioReady', normalizedPayload);
            }
            if (parsed.type === 'cameraModeChanged') {
              postUnityMessage('cameraChanged', normalizedPayload);
            }
            return;
          }
        } catch (error) {
          console.warn('Unable to parse Unity message.', error);
        }
        postUnityMessage('unityMessage', { value: String(message || '') });
      };

      function hasPlatformCapability(capability) {
        return platformCapabilities[capability] === true;
      }

      function sendPlatformBridge(method, payload) {
        if (!window.uavUsvUnityInstance ||
            !window.uavUsvUnityInstance.SendMessage) {
          return false;
        }
        window.uavUsvUnityInstance.SendMessage(
          'PlatformBridge',
          method,
          JSON.stringify(payload || {}),
        );
        return true;
      }

      function finiteNumber(value, fallback) {
        var number = Number(value);
        return Number.isFinite(number) ? number : (fallback || 0);
      }

      function normalizePose(item) {
        var pose = item || {};
        var inputPosition = Array.isArray(pose.position)
          ? pose.position
          : [];
        var eastM = finiteNumber(
          pose.eastM,
          inputPosition.length >= 3 ? inputPosition[0] : pose.x,
        );
        var northM = finiteNumber(
          pose.northM,
          inputPosition.length >= 3 ? inputPosition[1] : pose.y,
        );
        var upM = finiteNumber(
          pose.upM,
          inputPosition.length >= 3 ? inputPosition[2] : pose.z,
        );
        var velocityEastMps = finiteNumber(pose.velocityEastMps, 0);
        var velocityNorthMps = finiteNumber(pose.velocityNorthMps, 0);
        var rawHeading = Number(pose.headingDeg);
        var headingDeg = Number.isFinite(rawHeading)
          ? rawHeading
          : Math.atan2(velocityEastMps, velocityNorthMps) * 180 / Math.PI;
        if (headingDeg < 0) headingDeg += 360;
        var normalized = {
          deviceCode: pose.deviceCode || pose.deviceId || pose.code || pose.id || '',
          deviceType: pose.deviceType || pose.type || '',
          type: pose.type || '',
          state: pose.state || '',
          valid: pose.valid !== false,
          speedMps: finiteNumber(pose.speedMps, 0),
          velocityEastMps: velocityEastMps,
          velocityNorthMps: velocityNorthMps,
          velocityUpMps: finiteNumber(pose.velocityUpMps, 0),
          position: [
            eastM,
            northM,
            upM,
          ],
          eastM: eastM,
          northM: northM,
          upM: upM,
          headingDeg: headingDeg,
          x: eastM,
          y: northM,
          z: upM,
          yaw: headingDeg,
          yawDegrees: headingDeg,
        };
        if (Array.isArray(pose.orientation) && pose.orientation.length >= 4) {
          normalized.orientation = pose.orientation.slice(0, 4).map(function (value) {
            return finiteNumber(value, 0);
          });
        }
        return normalized;
      }

      function normalizePoseBatch(payload) {
        var source = payload || {};
        var rawPoses = Array.isArray(source.poses) ? source.poses.slice() : [];
        if (!rawPoses.length && Array.isArray(source.devices)) rawPoses = rawPoses.concat(source.devices);
        if (!rawPoses.length && Array.isArray(source.vehicles)) rawPoses = rawPoses.concat(source.vehicles);
        if (!rawPoses.length && Array.isArray(source.agents)) rawPoses = rawPoses.concat(source.agents);
        if (Array.isArray(source.targets)) rawPoses = rawPoses.concat(source.targets);
        return {
          runtimeMode: String(source.runtimeMode || 'VIRTUAL_SIMULATION'),
          coordinateFrame: String(source.coordinateFrame || 'GLOBAL_ENU'),
          runId: finiteNumber(source.runId || runId, 0),
          sequence: finiteNumber(source.sequence, 0),
          sampleTime: finiteNumber(
            source.sampleTime || source.timestamp,
            Date.now(),
          ),
          timestamp: finiteNumber(source.timestamp, Date.now()),
          timestamp_ms: finiteNumber(
            source.timestamp_ms || source.timestampMs || source.timestamp,
            Date.now(),
          ),
          poses: rawPoses.map(normalizePose).filter(function (pose) {
            return String(pose.deviceCode || '').trim().length > 0;
          }),
        };
      }

      function normalizeMissionState(message) {
        var payload = Object.assign({}, message.payload || {}, {
          requestId: message.requestId || (message.payload && message.payload.requestId) || '',
        });
        var type = normalizeCommand(payload.command || message.type);
        var states = {
          missionstart: 'RUNNING',
          missionresume: 'RUNNING',
          missionpause: 'PAUSED',
          missionstop: 'STOPPED',
          missionreset: 'RESET',
          missioncomplete: 'COMPLETED',
          missionfail: 'FAILED',
          missioncancel: 'CANCELLED',
        };
        var state = String(payload.state || payload.phase || states[type] || '').toUpperCase();
        return {
          requestId: payload.requestId,
          runId: String(payload.runId || runId || ''),
          sequence: finiteNumber(payload.sequence, 0),
          state: state,
          phase: String(payload.phase || state),
          status: String(payload.status || state),
          message: String(payload.message || payload.detail || ''),
        };
      }

      function dispatchToUnity(message) {
        if (!window.uavUsvUnityInstance ||
            !window.uavUsvUnityInstance.SendMessage) {
          return false;
        }

        var type = normalizeCommand(message.type);
        var payload = message.payload || {};

        if (type === 'initializeplatform') {
          return sendPlatformBridge('InitializePlatform', {
            runId: String(payload.runId || runId || ''),
            coordinateSystem: String(payload.coordinateSystem || 'ROS_ENU'),
            platform: String(payload.platform || 'vue-webgl'),
            requestId: message.requestId || '',
            protocolVersion: String(payload.protocolVersion || '2.0'),
          });
        }
        if (type === 'loadscenario') {
          return sendPlatformBridge('LoadScenario', {
            requestId: message.requestId || '',
            runtimeMode: String(payload.runtimeMode || 'VIRTUAL_SIMULATION'),
            runId: String(payload.runId || runId || ''),
            scenarioId: String(payload.scenarioId || payload.algorithmCode || 'GB_SFLA_CS'),
            algorithmCode: String(payload.algorithmCode || payload.scenarioId || 'GB_SFLA_CS'),
            uavCount: finiteNumber(payload.uavCount, 3),
            usvCount: finiteNumber(payload.usvCount, 3),
            targetCount: finiteNumber(payload.targetCount, 1),
            initialSpeedMps: finiteNumber(payload.initialSpeedMps, 0),
            initialHeadingDeg: finiteNumber(payload.initialHeadingDeg, 0),
            seed: finiteNumber(payload.seed, 0),
            sceneName: String(payload.sceneName || ''),
            coordinateSystem: String(payload.coordinateSystem || 'ROS_ENU'),
          });
        }
        if (type === 'regeneratescenario') {
          return sendPlatformBridge('RegenerateScenario', {
            requestId: message.requestId || '',
            runtimeMode: String(payload.runtimeMode || 'VIRTUAL_SIMULATION'),
            algorithmCode: String(payload.algorithmCode || 'GB_SFLA_CS'),
            runId: String(payload.runId || runId || ''),
            uavCount: finiteNumber(payload.uavCount, 3),
            usvCount: finiteNumber(payload.usvCount, 3),
            targetCount: finiteNumber(payload.targetCount, 1),
            initialSpeedMps: finiteNumber(payload.initialSpeedMps, 0),
            initialHeadingDeg: finiteNumber(payload.initialHeadingDeg, 0),
            seed: finiteNumber(payload.seed, 0),
          });
        }
        if (type === 'poseframe' || type === 'applyposebatch') {
          var poseBatch = normalizePoseBatch(payload);
          poseBatch.requestId = message.requestId || '';
          return sendPlatformBridge('ApplyPoseBatch', poseBatch);
        }
        if (type === 'spectrumframe') {
          if (!hasPlatformCapability('spectrum-frame')) {
            throw new Error('Unity spectrum bridge capability is unavailable.');
          }
          window.uavUsvUnityInstance.SendMessage(
            'UnitySpectrumBridge',
            'ReceiveFromVue',
            JSON.stringify(message),
          );
          return true;
        }
        if (
          type === 'missionstart' ||
          type === 'missionpause' ||
          type === 'missionresume' ||
          type === 'missionstop' ||
          type === 'missionreset' ||
          type === 'missioncomplete' ||
          type === 'missionfail' ||
          type === 'missioncancel'
        ) {
          return sendPlatformBridge('SetMissionState', normalizeMissionState(message));
        }
        if (type === 'missionstate') {
          return sendPlatformBridge('SetMissionState', {
            requestId: message.requestId || '',
            runId: String(payload.runId || runId || ''),
            sequence: finiteNumber(payload.sequence, 0),
            state: String(payload.state || payload.phase || ''),
            phase: String(payload.phase || payload.state || ''),
            status: String(payload.status || ''),
            message: String(payload.message || payload.detail || ''),
          });
        }
        if (type === 'selectdevice') {
          return sendPlatformBridge('SelectDevice', {
            requestId: message.requestId || '',
            deviceCode: String(payload.deviceCode || payload.deviceId || ''),
          });
        }
        if (type === 'focusdevice') {
          var selected = sendPlatformBridge('SelectDevice', {
            requestId: message.requestId || '',
            deviceCode: String(payload.deviceCode || payload.deviceId || ''),
          });
          var focused = sendPlatformBridge('SetCameraMode', {
            requestId: message.requestId || '',
            mode: 'device-follow',
            deviceCode: String(payload.deviceCode || payload.deviceId || ''),
          });
          return selected || focused;
        }
        if (type === 'switchcamera' || type === 'setcameramode') {
          return sendPlatformBridge('SetCameraMode', {
            requestId: message.requestId || '',
            mode: String(payload.mode || 'overview'),
            deviceCode: String(payload.deviceCode || payload.deviceId || ''),
          });
        }
        if (type === 'toggletrajectory') {
          return sendPlatformBridge('SetTrajectoryVisible', {
            visible: payload.visible !== false,
          });
        }
        if (
          type === 'sendcontrolcommand'
          && /^mission(start|pause|resume|stop|reset|complete|fail|cancel)$/.test(
            normalizeCommand(payload.command),
          )
        ) {
          sendPlatformBridge('SetMissionState', normalizeMissionState(message));
        }

        var serialized = JSON.stringify(message);

        var needsCommandBridge =
          type === 'cameracontrol' ||
          type === 'sendcontrolcommand';
        var needsAlgorithmBridge =
          (runtimeScope === 'MISSION_CENTER' && type === 'sendcontrolcommand');
        var needsVisualBridge = type === 'visualsensorsubscribe';

        if (needsCommandBridge) {
          if (!hasPlatformCapability('camera-control') &&
              !hasPlatformCapability('vehicle-control')) {
            throw new Error('Unity command bridge capability is unavailable.');
          }
          window.uavUsvUnityInstance.SendMessage(
            'WebCommandBridge',
            'ReceiveFromVue',
            serialized,
          );
        }
        if (needsAlgorithmBridge) {
          if (!hasPlatformCapability('algorithm-scenario')) {
            throw new Error('Unity algorithm scenario bridge capability is unavailable.');
          }
          window.uavUsvUnityInstance.SendMessage(
            'AlgorithmScenarioBridge',
            'ReceiveFromVue',
            serialized,
          );
        }
        if (needsVisualBridge) {
          if (!hasPlatformCapability('visual-sensor')) {
            throw new Error('Unity visual sensor bridge capability is unavailable.');
          }
          window.uavUsvUnityInstance.SendMessage(
            'UnityVisualSensorBridge',
            'ReceiveFromVue',
            serialized,
          );
        }
        return true;
      }

      function queueUnityMessage(message) {
        pendingUnityMessages.push(message);
        if (pendingUnityMessages.length > 200) pendingUnityMessages.shift();
      }

      function flushPendingUnityMessages() {
        if (!platformBridgeReady || !window.uavUsvUnityInstance) return;
        var queued = pendingUnityMessages.splice(0, pendingUnityMessages.length);
        queued.forEach(function (message) {
          try {
            dispatchToUnity(message);
          } catch (error) {
            postUnityMessage('unityBridgeError', {
              message: String(error && error.message ? error.message : error),
              requestedType: message.type || '',
              requestId: message.requestId || '',
            });
          }
        });
      }

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === 'error') div.style = 'background: #7f1d1d; color: #fee2e2; padding: 10px;';
        else {
          if (type === 'warning') div.style = 'background: #facc15; color: #1f2937; padding: 10px;';
          setTimeout(function () {
            if (div.parentNode === warningBanner) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function reportFatal(message) {
        loadingBar.style.display = 'none';
        unityShowBanner(message, 'error');
        postUnityMessage('unityError', { message: message });
      }

      function normalizeCommand(value) {
        return String(value || '').trim().toLowerCase();
      }

      function dispatchUnityKey(key, code, keyCode) {
        canvas.focus();
        var eventInit = {
          key: key,
          code: code,
          keyCode: keyCode,
          which: keyCode,
          bubbles: true,
          cancelable: true,
        };
        ['keydown', 'keyup'].forEach(function (type) {
          var event = new KeyboardEvent(type, eventInit);
          canvas.dispatchEvent(event);
          document.dispatchEvent(event);
          window.dispatchEvent(event);
        });
      }

      function applyUnityFallback(message) {
        var type = normalizeCommand(message.type);
        var payload = message.payload || {};
        var command = normalizeCommand(payload.command);
        var mode = normalizeCommand(payload.mode);

        if (type === 'sendcontrolcommand') {
          if (command === 'takeoff' || command === 'startmission') {
            dispatchUnityKey(' ', 'Space', 32);
            return 'space';
          }
          if (command === 'stopmission' || command === 'reset') {
            dispatchUnityKey('r', 'KeyR', 82);
            return 'reset';
          }
        }

        if (type === 'switchcamera') {
          var cameraKeys = {
            overview: ['1', 'Digit1', 49],
            'follow-usv': ['2', 'Digit2', 50],
            'follow-uav': ['3', 'Digit3', 51],
            lighthouse: ['4', 'Digit4', 52],
          };
          var cameraKey = cameraKeys[mode];
          if (cameraKey) {
            dispatchUnityKey(cameraKey[0], cameraKey[1], cameraKey[2]);
            return cameraKey[1];
          }
        }

        if (type === 'focusdevice') {
          dispatchUnityKey('f', 'KeyF', 70);
          return 'focus';
        }

        if (type === 'toggletrajectory') {
          dispatchUnityKey('v', 'KeyV', 86);
          return 'trajectory';
        }

        return '';
      }

      function initializePlatformBridge() {
        var buildId = 'unity-20260809-platform-bridge';
        publishPlatformReady({
          ready: true,
          controlsReady: true,
          cameraReady: true,
          algorithmReady: true,
          visualSensorReady: false,
          buildId: buildId,
          capabilities: platformBridgeMethods.concat([
            'camera-control',
            'vehicle-control',
            'algorithm-scenario',
            'visual-sensor',
          ]),
        });
        sendPlatformBridge('InitializePlatform', {
          runId: String(runId || ''),
          coordinateSystem: 'ROS_ENU',
          platform: 'vue-webgl',
          protocolVersion: '1.0',
        });
      }

      function hasWebGL() {
        try {
          var probe = document.createElement('canvas');
          return !!(
            window.WebGLRenderingContext &&
            (probe.getContext('webgl2') || probe.getContext('webgl') || probe.getContext('experimental-webgl'))
          );
        } catch (error) {
          return false;
        }
      }

      function resizeEmbeddedCanvas() {
        if (!embedded) return;
        var width = Math.max(1, window.innerWidth);
        var height = Math.max(1, window.innerHeight);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
      }

      function embeddedRenderPixelRatio() {
        var nativeRatio = Math.min(window.devicePixelRatio || 1, 2);
        var widthRatio = 1920 / Math.max(1, window.innerWidth);
        var heightRatio = 1080 / Math.max(1, window.innerHeight);
        return Math.min(nativeRatio, widthRatio, heightRatio);
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = 'unity-mobile';
        canvas.className = 'unity-mobile';
      } else {
        canvas.style.width = '100%';
        canvas.style.height = '100%';
      }

      loadingBar.style.display = 'block';
      resizeEmbeddedCanvas();
      window.addEventListener('resize', resizeEmbeddedCanvas);
      if (window.ResizeObserver) {
        new ResizeObserver(resizeEmbeddedCanvas).observe(container);
      }

      if (!hasWebGL()) {
        reportFatal('Your browser does not support WebGL or hardware acceleration is disabled. Enable hardware acceleration in Chrome/Edge and verify WebGL/WebGL2 in chrome://gpu or edge://gpu.');
      } else {
        var buildUrl = 'Build';
        var buildName = 'unity-overview';
        var loaderUrl = withBuildStamp(buildUrl + '/' + buildName + '.loader.js');
        var config = {
          dataUrl: withBuildStamp(buildUrl + '/' + buildName + '.data'),
          frameworkUrl: withBuildStamp(buildUrl + '/' + buildName + '.framework.js'),
          codeUrl: withBuildStamp(buildUrl + '/' + buildName + '.wasm'),
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'UAV-USV',
          productName: 'UAV_USV_WebGL',
          productVersion: '0.1',
          matchWebGLToCanvasSize: true,
          autoSyncPersistentDataPath: true,
          showBanner: unityShowBanner,
          devicePixelRatio: embedded ? embeddedRenderPixelRatio() : window.devicePixelRatio || 1,
          cacheControl: function () {
            return 'no-store';
          },
        };

        var script = document.createElement('script');
        script.src = loaderUrl;
        script.onerror = function () {
          reportFatal(
            'Unity WebGL loader 加载失败，请确认 /' + buildName
            + '/Build/' + buildName + '.loader.js 可以访问。',
          );
        };
        script.onload = function () {
          if (typeof createUnityInstance !== 'function') {
            reportFatal('Unity WebGL loader 已加载，但 createUnityInstance 不存在。请重新构建 WebGL 包。');
            return;
          }
          createUnityInstance(canvas, config, function (progress) {
            progressBarFull.style.width = 100 * progress + '%';
            postUnityMessage('unityProgress', { progress: progress });
          })
            .then(function (unityInstance) {
              window.uavUsvUnityInstance = unityInstance;
              resizeEmbeddedCanvas();
              loadingBar.style.display = 'none';
              initializePlatformBridge();
              postUnityMessage('sceneLoaded', {
                mode: 'webgl',
                productName: 'UAV_USV_WebGL',
                buildId: 'unity-20260809-platform-bridge',
              });
              postUnityMessage('unityReady', {
                mode: 'webgl',
                productName: 'UAV_USV_WebGL',
                buildId: 'unity-20260804-175129-camera-v5',
              });
              fullscreenButton.onclick = function () {
                unityInstance.SetFullscreen(1);
              };
            })
            .catch(function (message) {
              reportFatal(String(message));
            });
        };
        document.body.appendChild(script);
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        var data = event.data || {};
        if (data.source !== 'vue-console' || !data.message) return;
        if (data.runtimeScope && data.runtimeScope !== runtimeScope) return;
        if (data.runtimeInstanceId && data.runtimeInstanceId !== runtimeInstanceId) return;
        var message = data.message;
        var bridgeSent = false;
        var queuedForBridge = false;
        if (window.uavUsvUnityInstance && window.uavUsvUnityInstance.SendMessage) {
          var waitingForSpectrumCapability =
            normalizeCommand(message.type) === 'spectrumframe' &&
            !hasPlatformCapability('spectrum-frame');
          if (!platformBridgeReady || waitingForSpectrumCapability) {
            queueUnityMessage(message);
            queuedForBridge = true;
          } else {
            try {
              bridgeSent = dispatchToUnity(message);
            } catch (error) {
              console.warn('Unity WebBridge command failed.', error);
              postUnityMessage('unityBridgeError', {
                message: String(error && error.message ? error.message : error),
                requestedType: message.type || '',
                requestId: message.requestId || '',
              });
            }
          }
        }
        var fallback = bridgeSent || queuedForBridge ? '' : applyUnityFallback(message);
        postUnityMessage('vueCommandReceived', {
          requestId: message.requestId || '',
          type: message.type,
          payload: message.payload || {},
          bridgeSent: bridgeSent,
          queued: queuedForBridge,
          fallback: fallback,
        });
      });
    </script>
  </body>
